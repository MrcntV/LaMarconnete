# ============================================================
# NGINX CONFIGURATION — La marcOnnête
# Main site + Admin panel
# ============================================================

# Rate limiting zones (global, defined at http level)
# Include in /etc/nginx/nginx.conf http block:
#   limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;



# ============================================================
# MAIN SITE — lamarconnete.fr → port 43749
# ============================================================
server {
    listen 80;
    server_name admin.mrcntv.com;


    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
     server_name admin.mrcntv.com;

    # SSL — Let's Encrypt (certbot auto-generates these paths)
    ssl_certificate     /etc/letsencrypt/live/lamarconnete.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lamarconnete.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Block common attack paths
    location ~* \.(env|git|svn|htaccess|htpasswd)$ {
        deny all;
        return 404;
    }
    location ~ /\. { deny all; }
    location ~* /wp-admin { return 404; }
    location ~* /phpmyadmin { return 404; }

    # Rate limit on API
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://localhost:43749;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Stricter rate limit on auth endpoints
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass http://localhost:43749;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stripe webhook — pass raw body (no body-parser interference)
    location /api/stripe/webhook {
        proxy_pass http://localhost:43749;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # Cache static assets
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|css|js)$ {
        proxy_pass http://localhost:43749;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Main proxy — React app
    location / {
        proxy_pass http://localhost:43749;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Logs
    access_log /var/log/nginx/lamarconnete_access.log;
    error_log  /var/log/nginx/lamarconnete_error.log;
}

# ============================================================
# ADMIN PANEL — admin.lamarconnete.fr → port 43750
# ============================================================
server {
    listen 80;
    server_name admin.lamarconnete.fr;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.lamarconnete.fr;

    # SSL — Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/admin.lamarconnete.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.lamarconnete.fr/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Restrict to known IP(s) for extra security (optional — uncomment and set your IP)
    # allow 203.0.113.42;
    # deny all;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Block attack paths
    location ~ /\. { deny all; }

    # Admin API calls are proxied to main server
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://localhost:43749;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin panel static files
    location / {
        proxy_pass http://localhost:43750;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/admin_lamarconnete_access.log;
    error_log  /var/log/nginx/admin_lamarconnete_error.log;
}
