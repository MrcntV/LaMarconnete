server {
    listen 80;
server_name mrcntv.com www.mrcntv.com;
    return 301 https://mrcntv.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mrcntv.com www.mrcntv.com;

    # 🔐 Certificats SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/mrcntv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrcntv.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 📄 Logs
    access_log /var/log/nginx/mrcntv-access.log;
    error_log  /var/log/nginx/mrcntv-error.log;

    # 🔐 En-têtes de sécurité
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 🔁 Reverse proxy vers ton app Node (port 4379)
    location / {
        proxy_pass http://127.0.0.1:4379;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # 🔁 Webhook GitHub
    location /webhook {
        proxy_pass http://127.0.0.1:4379/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 🚫 Protection fichiers cachés
    location ~ /\. {
        deny all;
        log_not_found off;
    }

    # 🚫 Méthodes HTTP interdites
    if ($request_method !~ ^(GET|POST|HEAD|OPTIONS)$ ) {
        return 444;
    }

    # ⏱️ Timeouts
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;
}