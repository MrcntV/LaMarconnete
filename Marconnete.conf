# ============================================================
#  NGINX — mrcntv.com + admin.mrcntv.com
#  Certificat : /etc/letsencrypt/live/mrcntv.com/
# ============================================================


# ============================================================
#  SITE PRINCIPAL — mrcntv.com -> port 43749
# ============================================================

server {
    listen 80;
    server_name mrcntv.com www.mrcntv.com;
    return 301 https://mrcntv.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mrcntv.com www.mrcntv.com;

    ssl_certificate     /etc/letsencrypt/live/mrcntv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrcntv.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.                    { deny all; }
    location ~* \.(env|git|htaccess)$ { deny all; return 404; }

    location /webhook {
        proxy_pass http://127.0.0.1:43749/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:43749;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:43749;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/mrcntv_access.log;
    error_log  /var/log/nginx/mrcntv_error.log;
}


# ============================================================
#  PANEL ADMIN — admin.mrcntv.com -> port 43750
# ============================================================

server {
    listen 80;
    server_name admin.mrcntv.com;
    return 301 https://admin.mrcntv.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name admin.mrcntv.com;

    # Même certificat — il couvre les 3 domaines
    ssl_certificate     /etc/letsencrypt/live/mrcntv.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mrcntv.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location ~ /\.                    { deny all; }
    location ~* \.(env|git|htaccess)$ { deny all; return 404; }

    location /api/ {
        proxy_pass http://127.0.0.1:43749;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:43750;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/admin_mrcntv_access.log;
    error_log  /var/log/nginx/admin_mrcntv_error.log;
}
