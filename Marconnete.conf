# ============================================================
#  NGINX — mrcntv.com + admin.mrcntv.com
#
#  Installation sur le serveur :
#    sudo cp /LaMarconnete/Marconnete.conf /etc/nginx/sites-available/Marconnete.conf
#    sudo ln -sf /etc/nginx/sites-available/Marconnete.conf /etc/nginx/sites-enabled/Marconnete.conf
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d mrcntv.com -d www.mrcntv.com -d admin.mrcntv.com
# ============================================================


# ============================================================
#  SITE PRINCIPAL — mrcntv.com -> port 43749
# ============================================================

server {
    listen 80;
    server_name mrcntv.com www.mrcntv.com;

    location ~ /\.                    { deny all; }
    location ~* \.(env|git|htaccess)$ { deny all; return 404; }

    location /webhook {
        proxy_pass http://127.0.0.1:43749/webhook;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:43749;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:43749;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    access_log /var/log/nginx/mrcntv_access.log;
    error_log  /var/log/nginx/mrcntv_error.log;
}


# ============================================================
#  PANEL ADMIN — admin.mrcntv.com -> port 43750
# ============================================================

